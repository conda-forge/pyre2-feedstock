{% set name = "pyre2" %}
{% set version = "0.3.10" %}
{% set sha256 = "d0b5ef860f1700f5e4beb579568bebfc30cdcdb9b42dd4438f0961ac78e30ee9" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/andreasvc/pyre2/archive/v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv
  skip: true  # [py<36]

requirements:
  build:
    - ninja
    - cmake >=3.15
    - make                                   # [unix]
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython                                 # [build_platform != target_platform]
    - pybind11                               # [build_platform != target_platform]
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
  host:
    - python
    - pybind11
    - cython
    - pip
    - re2
  run:
    - python
    - re2

test:
  commands:
    - export "PYTHONIOENCODING=utf8"  # [unix]
    - set "PYTHONIOENCODING=utf8"  # [win]
    - python -m unittest discover -f -s tests
  imports:
    - re2
  source_files:
    - tests

about:
  home: https://pypi.org/project/pyre2/
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Python wrapper for Google's RE2 using Cython
  doc_url: https://github.com/andreasvc/pyre2/blob/master/README.rst
  dev_url: https://github.com/andreasvc/pyre2

extra:
  recipe-maintainers:
    - sarnold
